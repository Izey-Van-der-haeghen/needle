<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Needle promo tile</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #FAFAF7; color: #141312; font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; }
  .tile { position: relative; width: 440px; height: 280px; padding: 40px 36px; box-sizing: border-box; }
  img { width: 96px; height: 96px; position: absolute; right: 36px; top: 36px; }
  .name { font: 700 46px/1 "Martian Mono", monospace; font-stretch: 112.5%; letter-spacing: -0.02em; margin-top: 18px; }
  .tag { font-size: 22px; line-height: 1.3; margin-top: 16px; }
  .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 10px; background: #FF6A55; }
</style>
</head>
<body>
<div class="tile">
  <img src="/icons/icon128.png" alt="">
  <div class="name">needle</div>
  <div class="tag">All-in-one<br>SEO &amp; GEO tool</div>
  <div class="bar"></div>
</div>
<script>document.fonts.ready.then(() => { document.title = "ready"; });</script>
</body>
</html>
