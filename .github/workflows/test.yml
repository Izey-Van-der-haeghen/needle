name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # No GitHub token left in .git/config for the later steps' third-party code
          # (npm ci's install scripts, npx addons-linter): nothing here pushes or fetches.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Lint the extension (addons-linter, read for Chrome)
        run: npm run lint:extension
      - name: Build the store package
        run: npm run package
